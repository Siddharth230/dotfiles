################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,1440x900@59,0x-900,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nemo
$menu = rofi -show drun
$browser = firefox-developer-edition
$code_editor = code


# KeyBinds Import
source = ~/.config/hypr/binds.conf


#################
### AUTOSTART ###
#################

# Autostart necessary procvscodiumesses (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = hyprlock
exec-once = pulseaudio --start
exec-once = hyprpaper
exec-once = $terminal
# exec-once = nm-applet &

#exec-once = waybar & swww-daemon
# exec-once = bash -c '[ -f ~/.config/wallpaper.txt ] && WALL=$(cat ~/.config/wallpaper.txt) && swww img "$WALL" && wal -i "$WALL"'
# exec-once = nm-applet --indicator & kdeconnect-indicator & $terminal


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,iHD      
env = WLR_RENDERER_ALLOW_SOFTWARE,1

env = QT_QPA_PLATFORMTHEME,qt6ct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
