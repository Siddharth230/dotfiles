source = /home/$USER/.cache/wal/colors-hyprland

# Main Monitor
background {
    monitor =eDP-1
    path = $wallpaper
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Secondary Monitor
background {
    monitor = HDMI-A-1
    path = $wallpaper
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor = eDP-1
    size = 200, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color9
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Time-Hour
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = $color10
    font_size = 175
    font_family = StretchPro
    position = -80, 350
    halign = center
    valign = center
}

# Time-Minute
label {
    monitor =eDP-1
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = $color9
    font_size = 175
    font_family = StretchPro
    position = 0, 180
    halign = center
    valign = center
}

# Day
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date +"%A" | tr '[:lower:]' '[:upper:]'
    color = #FFFFFF
    font_size = 90
    font_family = Anurati
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = $color10
    font_size = 40
    font_family = Recoil Backlash 
    position = 0, 250
    halign = center
    valign = center
}

# USER
label {
    monitor = eDP-1
    text =     $USER
    color = $color9
    font_size = 30
    font_family = SF Pro Display Bold
    position = 0, -130
    halign = center
    valign = center
}