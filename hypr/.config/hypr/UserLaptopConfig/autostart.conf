#################
### AUTOSTART ###
#################

# Autostart necessary procvscodiumesses (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = hypridle
exec-once = hyprlock
exec-once = waybar
exec-once = swww-daemon
exec-once = sleep .5 && swww restore
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0

# --- XDG Portal Fix ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Kill any existing portals to ensure a clean start
exec-once = killall -e xdg-desktop-portal-hyprland || true
exec-once = killall xdg-desktop-portal || true

# Start the Hyprland backend first, then the dispatcher
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = sleep 1
exec-once = /usr/lib/xdg-desktop-portal &
# --- End XDG Portal Fix ---

exec-once = kdeconnectd
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# exec-once = $terminal