
##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.* 

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, center, class:^(imv)$

windowrulev2 = fullscreen,class:^(Battle.net)$
windowrulev2 = fullscreen,class:^(World of Warcraft)$

windowrulev2 = fullscreen, class:(Waydroid)

windowrulev2 = noborder, class:(Waydroid)
windowrulev2 = noanim, class:(Waydroid)

layerrulev2 = blur, waybar
layerrulev2 = ignorezero, waybar
layerrulev2 = ignorealpha 0.5, waybar
layerrulev2 = blur, swaync-control-center
layerrulev2 = blur, swaync-notification-window
layerrulev2 = ignorezero, swaync-control-center
layerrulev2 = ignorezero, swaync-notification-window
layerrulev2 = ignorealpha 0.5, swaync-control-center
layerrulev2 = ignorealpha 0.5, swaync-notification-window
layerrulev2 = noanim, selection

windowrulev2 = float, class:^(kitty-dropterm)$
windowrulev2 = float, class:^(kitty-pulsemixer)$
windowrulev2 = float, class:^(kitty-taskbar)$
