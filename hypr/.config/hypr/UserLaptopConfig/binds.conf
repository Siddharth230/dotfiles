###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $code_editor
bind = $mainMod, F, exec, $browser
bind = $mainMod, D, exec, $menu
# bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
bind = $mainMod, V, togglefloating 
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, R, exec, ~/.config/waybar/waybar.sh
bind = $mainMod, Q, killactive
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit
bind = $mainMod, F11, fullscreen

# Toggle swaync notification center on Super key release
bindr = $mainMod, N, exec, swaync-client -t

# Window Screenshot 
bind = , Print, exec, hyprshot -m window -o ~/Pictures/Screenshots/

# Region Screenshot
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots/

# Active Monitor Screeshot
bind = $mainMod, S, exec, hyprshot -m active -m output -o ~/Pictures/Screenshots/

# bind = ALT, J, movewindow, l
# bind = ALT, L, movewindow, r
# bind = ALT, I, movewindow, u
# bind = ALT, K, movewindow, d 

# Change Window Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch Main Monitor Workspaces : mainMod + [1-5]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Switch Secondary Monitor Workspaces : mainMod + ALT + [1-5]
bind = $mainMod ALT, 1, workspace, 6
bind = $mainMod ALT, 2, workspace, 7
bind = $mainMod ALT, 3, workspace, 8
bind = $mainMod ALT, 4, workspace, 9
bind = $mainMod ALT, 5, workspace, 10

# Move Active Window To Main Monitor Workspace : mainMod + SHIFT + [1-5]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Move Active Window To Secondary Monitor Workspace : mainMod + SHIFT + ALT + [1-5]
bind = $mainMod SHIFT ALT, 1, movetoworkspace, 6
bind = $mainMod SHIFT ALT, 2, movetoworkspace, 7
bind = $mainMod SHIFT ALT, 3, movetoworkspace, 8
bind = $mainMod SHIFT ALT, 4, movetoworkspace, 9
bind = $mainMod SHIFT ALT, 5, movetoworkspace, 10

# Laptop Multimedia Keys For Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Laptop Multimedia Keys For LCD Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = , XF86TouchpadToggle, exec, hyprctl keyword input:touchpad:disable_while_typing toggle

bind = $mainMod, N, togglespecialworkspace, magic
bind = $mainMod SHIFT, N, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , mouse:276, workspace, +1
bind = , mouse:275, workspace, -1

# Open Logout Menu
bind = ALT, TAB, exec, wlogout -b 2

# Select And Change Wallpaper 
bind = ALT, W, exec, ~/.config/hypr/wallpaper.sh

# Refresh Waybar
bind = ALT, A, exec, ~/.config/waybar/scripts/refresh.sh 

# Select Waybar Type
bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh

# Refresh Swaync
bind = ALT, R, exec, ~/.config/swaync/refresh.sh

bind = $mainMod, SPACE, exec, pypr toggle term
bind = $mainMod, G, exec, pypr toggle music
bind = $mainMod, T, exec, pypr toggle taskbar
#bind = CTRL, ESCAPE, exec, gksu #Dont worry about this
